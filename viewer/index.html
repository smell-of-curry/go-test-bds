<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>go-test-bds viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color: #e6edf3;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.12);
        pointer-events: none;
        white-space: pre;
        z-index: 2;
      }
      #schema-error {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: rgba(10, 12, 18, 0.92);
        color: #ff6b6b;
        font-size: 16px;
        z-index: 10;
        padding: 24px;
        text-align: center;
      }
      #schema-error.visible {
        display: flex;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        pointer-events: none;
        z-index: 2;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .entity-label {
        position: absolute;
        transform: translate(-50%, -100%);
        padding: 1px 4px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 11px;
        white-space: nowrap;
      }
      /* Burnt-in caption for 1280×720 capture — large enough to read in a montage. */
      #caption {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px 20px 16px;
        background: linear-gradient(
          transparent,
          rgba(0, 0, 0, 0.82) 30%,
          rgba(0, 0, 0, 0.9)
        );
        pointer-events: none;
        z-index: 3;
        font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif;
      }
      #caption.visible {
        display: block;
      }
      #caption .caption-line {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.25;
        color: #f0f3f6;
        text-shadow: 0 1px 2px #000;
      }
      #caption.failed .caption-line {
        color: #ffb4b4;
      }
      #caption .caption-message {
        margin-top: 6px;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.3;
        color: #ffdddd;
        text-shadow: 0 1px 2px #000;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #ui-panel {
        display: none;
        position: fixed;
        top: 8px;
        right: 8px;
        width: min(360px, 42vw);
        max-height: min(420px, 55vh);
        overflow: auto;
        padding: 10px 12px;
        background: rgba(8, 10, 16, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.18);
        pointer-events: none;
        z-index: 3;
        font: 13px/1.35 ui-sans-serif, system-ui, Segoe UI, sans-serif;
      }
      #ui-panel.visible {
        display: block;
      }
      #ui-panel .ui-block + .ui-block {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      #ui-panel .ui-kind {
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9aa7b5;
      }
      #ui-panel .ui-title {
        margin-top: 2px;
        font-size: 16px;
        font-weight: 700;
        color: #eef2f6;
      }
      #ui-panel .ui-body {
        margin-top: 4px;
        color: #c5ced8;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #ui-panel .ui-buttons {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #ui-panel .ui-button {
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #e6edf3;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="crosshair"></div>
    <div id="labels"></div>
    <div id="overlay">connecting…</div>
    <div id="caption"></div>
    <div id="ui-panel"></div>
    <div id="schema-error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
