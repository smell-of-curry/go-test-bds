# Viewer Stage 12 visual regression. Goldens are SwiftShader-stable — if the
# first CI run fails against Windows-authored PNGs, re-run with GOLDEN_UPDATE in
# a one-off job (or accept the artefact PNGs) and commit the CI-rendered set.
name: Viewer golden

on:
  push:
    branches: [main, master]
    paths: [viewer/**, .github/workflows/viewer-golden.yml]
  pull_request:
    paths: [viewer/**, .github/workflows/viewer-golden.yml]

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:fixture
      - run: npx vite build
      - name: Golden + smoke + terrain
        run: npx playwright test --project=golden --project=smoke --project=terrain
      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-golden-results
          path: viewer/test-results
          retention-days: 14
